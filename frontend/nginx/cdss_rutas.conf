# Reglas de la aplicación, comunes al servidor de desarrollo (nginx.conf, puerto 80) y al de
# producción (nginx.prod.conf.template, puerto 443). Se incluye dentro de un bloque server.
# Las rutas NDJSON sin búfer, la subida de guías y el resto de /api no cambian entre entornos.

root /usr/share/nginx/html;
index index.html;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;

# Consultas clínicas respondidas por etapas en NDJSON (parte D2): sin búfer, para que cada
# evento llegue al navegador apenas el backend lo escribe, y con tiempos mayores que el
# máximo de una consulta con reintento (25 s). Las expresiones regulares tienen prioridad
# sobre el prefijo /api/, que no cambia.
location ~ ^/api/(pacientes/[^/]+/consultas|consultas/[^/]+/(datos-faltantes|continuar))$ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# M11 (parte F2): subida de guías en PDF de hasta 20 MB (el backend corta en 20 MB y responde
# 413). Solo esta ruta admite cuerpos grandes; el resto conserva el límite de 1 MB de Nginx.
location = /api/conocimiento/documentos {
    client_max_body_size 25m;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Rutas de la aplicación React (BrowserRouter)
location / {
    try_files $uri /index.html;
}
