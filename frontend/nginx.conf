# Nginx: único punto de entrada (capa 1). En Azure se agrega el bloque HTTPS (443)
# con el certificado de Let's Encrypt; en local se usa HTTP en el puerto 8080.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Consultas clínicas respondidas por etapas en NDJSON (parte D2): sin búfer, para que cada
    # evento llegue al navegador apenas el backend lo escribe, y con tiempos mayores que el
    # máximo de una consulta con reintento (25 s). Las expresiones regulares tienen prioridad
    # sobre el prefijo /api/, que no cambia.
    location ~ ^/api/(pacientes/[^/]+/consultas|consultas/[^/]+/datos-faltantes)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Rutas de la aplicación React (BrowserRouter)
    location / {
        try_files $uri /index.html;
    }
}
