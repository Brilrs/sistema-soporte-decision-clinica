# Nginx: único punto de entrada (capa 1). Desarrollo: HTTP en el puerto 80 del contenedor
# (8080 en el equipo). En Azure, docker-compose.prod.yml usa nginx.prod.conf.template (HTTPS en el
# 443, con el certificado de Let's Encrypt). Las reglas de la aplicación están en nginx/cdss_rutas.conf,
# el mismo archivo en los dos entornos.
server {
    listen 80;
    server_name _;

    include /etc/nginx/cdss/rutas.conf;
}
