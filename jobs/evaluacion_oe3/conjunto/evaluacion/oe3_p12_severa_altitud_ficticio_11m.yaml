respuesta_referencia: >-
  Con la hemoglobina ajustada por altitud (9,3 menos 2,5 da 6,8 g/dL) la niña tiene anemia severa:
  se trata como un caso de anemia moderada y se refiere inmediatamente a un establecimiento de salud
  de mayor capacidad resolutiva. La dosis es de 3 mg/kg/día de suplemento de hierro (máximo 70 mg/día
  de 6 a 35 meses), diaria durante 6 meses continuos. La hemoglobina se controla al mes, al segundo,
  al tercer y al sexto mes de iniciado el tratamiento.
afirmaciones_clave:
  - Se refiere inmediatamente a un establecimiento de salud de mayor capacidad resolutiva.
  - El tratamiento es con suplemento de hierro a 3 mg/kg/día, con un máximo de 70 mg/día.
  - La hemoglobina se controla al mes, al segundo, al tercer y al sexto mes de iniciado el tratamiento.
