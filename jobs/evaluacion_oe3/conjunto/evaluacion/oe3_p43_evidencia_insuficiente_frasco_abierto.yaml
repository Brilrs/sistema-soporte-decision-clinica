respuesta_referencia: >-
  Las guías indexadas indican dónde guardar el suplemento (bien cerrado, protegido de la luz, el
  calor y la humedad), pero no cuánto tiempo puede usarse una vez abierto. El sistema debe declarar
  evidencia insuficiente.
afirmaciones_clave:
  - Las guías disponibles no indican cuánto tiempo puede usarse el jarabe una vez abierto.
