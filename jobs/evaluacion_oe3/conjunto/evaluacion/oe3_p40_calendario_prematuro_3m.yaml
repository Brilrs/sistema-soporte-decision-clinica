respuesta_referencia: >-
  En el nacido con bajo peso o prematuro son 2 mediciones: a los 30 días de nacido y al tercer mes
  de iniciada la suplementación. La suplementación preventiva se inicia a los 30 días de nacido, con
  2 mg/kg/día en gotas, de forma diaria, hasta los 6 meses cumplidos.
