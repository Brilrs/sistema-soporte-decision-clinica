notas: >-
  La lista completa también incluye frotis sanguíneo, gota gruesa en zonas de malaria y plomo en
  zonas de riesgo; no se usan como criterio. Comprobar en la ficha que «Recuento de reticulocitos.»
  del anclaje no se confunda con el flujograma del Anexo N° 5 (allí la extracción dice
  «retículodtos»).
