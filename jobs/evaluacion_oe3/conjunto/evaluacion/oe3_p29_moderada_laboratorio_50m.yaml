respuesta_referencia: >-
  Se solicitan de inmediato: hemograma completo de tercera generación, recuento de reticulocitos,
  ferritina, proteína C reactiva para descartar infección o proceso inflamatorio, frotis sanguíneo y
  examen parasitológico seriado en heces. De 24 a 59 meses, la ferritina sérica menor de 12 ug/L
  confirma la anemia ferropénica (menor de 30 ug/L con infección o inflamación).
afirmaciones_clave:
  - Se solicita un hemograma completo de tercera generación.
  - Se solicita la ferritina sérica.
revisado: true
