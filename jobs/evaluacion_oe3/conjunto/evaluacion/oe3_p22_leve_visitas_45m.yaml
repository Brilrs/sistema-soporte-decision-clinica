respuesta_referencia: >-
  Recibe cuatro visitas domiciliarias o de telemonitoreo: la primera a los 7 días de iniciado el
  tratamiento, la segunda entre el primer y segundo mes, la tercera entre el tercer y cuarto mes y
  la cuarta entre el quinto y sexto mes del tratamiento.
afirmaciones_clave:
  - La primera visita domiciliaria es a los 7 días de iniciado el tratamiento.
  - "Son cuatro visitas: a los 7 días, entre el primer y segundo mes, entre el tercer y cuarto mes y entre el quinto y sexto mes."
