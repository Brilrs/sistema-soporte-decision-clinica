paciente:
  fuente: seed_demo
  dni_ficticio: "81901234"
  fecha_tamizaje: 2026-10-16
fecha_referencia: 2026-10-20
consulta: ¿Cuál es el manejo de la anemia severa y cuándo se refiere a un establecimiento de mayor capacidad resolutiva?
estado_esperado: VERIFICADA
clasificacion_esperada: ANEMIA_SEVERA
requiere_derivacion: true
evidencia_suficiente_esperada: true
criterios:
  - id: C1
    descripcion: Tratamiento como anemia moderada y referencia inmediata
    obligatorio: true
    alternativas:
      - documento: NTS 213-MINSA/DGIESP-2024
        paginas: [22, 22]
        numeral: 6.1.2 B.7
        texto_anclaje: "Se indica el tratamiento como un caso de anemia moderada y se refiere inmediatamente a un establecimiento de salud de mayor capacidad resolutiva para la atención especializada."
  - id: C2
    descripcion: Dosis del tratamiento de 6 a 35 meses (Tabla N° 17)
    obligatorio: false
    alternativas:
      - documento: NTS 213-MINSA/DGIESP-2024
        paginas: [19, 19]
        numeral: 6.1.2 B.3, Tabla N° 17
        texto_anclaje: "| 6 a 35 meses | 3 mg/Kg/día (Máximo dosis 70 mg/día) |"
  - id: C3
    descripcion: Contrarreferencia con evolución favorable
    obligatorio: false
    alternativas:
      - documento: NTS 213-MINSA/DGIESP-2024
        paginas: [22, 22]
        numeral: 6.1.2 B.7
        texto_anclaje: "El/la paciente con evolución favorable al tratamiento de anemia severa es contrarreferido/a al establecimiento de salud"
  - id: C4
    descripcion: Otros motivos de referencia durante el tratamiento
    obligatorio: false
    alternativas:
      - documento: NTS 213-MINSA/DGIESP-2024
        paginas: [22, 22]
        numeral: 6.1.2 B.10
        texto_anclaje: "En los siguientes controles de Hb, el valor es menor al normal a pesar de haber adherencia a los suplementos de hierro."
respuesta_referencia: >-
  La anemia severa se trata como un caso de anemia moderada (suplemento de hierro a 3 mg/kg/día,
  máximo 70 mg/día de 6 a 35 meses) y se refiere inmediatamente a un establecimiento de salud de
  mayor capacidad resolutiva para la atención especializada. Con evolución favorable, la paciente es
  contrarreferida al establecimiento de salud para continuar y completar el tratamiento.
afirmaciones_clave:
  - La anemia severa se trata como un caso de anemia moderada.
  - Se refiere inmediatamente a un establecimiento de salud de mayor capacidad resolutiva.
revisado: true
revisado_por: "Coordinador CRED, Centro de Salud San Luis"
fecha_revision: 2026-11-27
observaciones_revision: null
notas: >-
  Hb 6,8 g/dL a los 26 meses, por debajo de 7,0 (Tabla N° 13 de la RM 429). Es el único caso severo
  de seed_demo.
