respuesta_referencia: >-
  De 36 meses a 11 años, la hemoglobina se controla al mes de iniciado el tratamiento y al tercer y
  sexto mes del tratamiento. A los 30 días de iniciado el tratamiento el incremento de hemoglobina
  debe ser de 1 g/dL o más.
afirmaciones_clave:
  - La hemoglobina se controla al mes, al tercer mes y al sexto mes del tratamiento.
