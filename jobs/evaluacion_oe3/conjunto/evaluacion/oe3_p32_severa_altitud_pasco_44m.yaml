respuesta_referencia: >-
  Para una residencia entre 4000 y 4499 msnm el ajuste es de 2,9 g/dL, que se resta de la
  hemoglobina observada: 9,8 menos 2,9 da 6,9 g/dL, anemia severa. Se indica el tratamiento como un
  caso de anemia moderada y se refiere inmediatamente a un establecimiento de mayor capacidad
  resolutiva para la atención especializada; con evolución favorable es contrarreferido para
  completar el tratamiento.
afirmaciones_clave:
  - El ajuste por altitud para 4000 a 4499 msnm es 2,9 g/dL.
  - La hemoglobina ajustada es 6,9 g/dL, anemia severa.
  - Se refiere inmediatamente a un establecimiento de mayor capacidad resolutiva.
