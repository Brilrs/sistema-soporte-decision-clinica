respuesta_referencia: >-
  Con hemoglobina de 11 g/dL o más, le corresponde suplementación preventiva con 30 mg de hierro
  elemental de sulfato ferroso o complejo polimaltosado férrico en jarabe, diaria, durante 6 meses
  continuos en el año. La alternativa es de 2 sobres diarios de micronutrientes en polvo de 1 g
  durante 6 meses continuos en el año.
afirmaciones_clave:
  - La dosis preventiva de 24 a 35 meses es de 30 mg de hierro elemental al día.
  - La suplementación dura 6 meses continuos en el año.
revisado: true
