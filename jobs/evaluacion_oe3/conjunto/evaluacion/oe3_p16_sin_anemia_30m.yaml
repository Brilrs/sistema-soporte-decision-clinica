observaciones_revision: null
notas: >-
  La Tabla N° 8 original de la NTS (página 13) no está vigente. El texto del numeral B.4 de la NTS
  («El niño y la niña de 24 a 35 meses de edad son suplementados durante 6 meses») sigue vigente y
  coincide en la duración.
