respuesta_referencia: >-
  Le corresponde tratamiento con suplemento de hierro a 3 mg/kg/día, con un máximo de 90 mg/día de
  36 a 59 meses, con sulfato ferroso o complejo polimaltosado férrico en jarabe, de forma diaria
  durante 6 meses continuos. La hemoglobina se controla al mes de iniciado el tratamiento y al tercer
  y sexto mes del tratamiento.
afirmaciones_clave:
  - El tratamiento es con suplemento de hierro a 3 mg/kg/día, con un máximo de 90 mg/día.
  - El tratamiento es diario durante 6 meses continuos.
  - La hemoglobina se controla al mes, al tercer mes y al sexto mes del tratamiento.
