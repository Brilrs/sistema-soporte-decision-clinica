observaciones_revision: null
notas: >-
  Sin criterios. Comprobación (26/11/2026): búsqueda con expresiones regulares, sin tildes ni
  mayúsculas, en el texto de los 202 fragmentos de la última versión de las cuatro guías (vigentes y
  no vigentes, base del ensayo, con las mismas cifras de fragmentos que la VM).
  «intoxica|sobredosis|overdose|poisoning|accidental»: 3 coincidencias, ninguna con un manejo: Anexo
  N° 4 de la NTS (página 34, guardar lejos del alcance de los niños «para evitar la ingesta
  accidental que pudiera causar intoxicación») y OMS 2016 (página 17, falta de datos sobre daño a
  largo plazo por sobredosis). «toxic»: 4, ninguna sobre el manejo. Si el sistema cita el Anexo N° 4
  para un manejo, la respuesta es incorrecta.
