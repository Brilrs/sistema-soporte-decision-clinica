respuesta_referencia: >-
  Las guías indexadas solo indican guardar el suplemento lejos del alcance de los niños para evitar
  una ingesta accidental que pudiera causar intoxicación; no dicen cómo se maneja. El sistema debe
  declarar evidencia insuficiente y no proponer un manejo.
afirmaciones_clave:
  - Las guías disponibles no indican cómo manejar una ingesta accidental del suplemento de hierro.
revisado: false
