notas: >-
  Fragmentos en inglés: el juez recibe el texto original enviado al modelo, no la traducción de la
  cita (sección 3 del diseño). La Tabla N° 8 de la RM 429 dice lo mismo para 36 a 59 meses, pero la
  pregunta es qué recomienda la OMS: no se acepta como alternativa (decisión para la ficha). El anclaje de C3 empieza en la presentación
  («Drops/syrups/tablets»), porque la duración sola también puede aparecer en las tablas de otros
  grupos de edad de páginas vecinas y daría un acierto falso.
