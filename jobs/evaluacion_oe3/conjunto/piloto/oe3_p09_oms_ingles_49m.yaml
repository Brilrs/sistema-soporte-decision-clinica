respuesta_referencia: >-
  La OMS recomienda la suplementación diaria con hierro como intervención de salud pública en niños
  de 24 a 59 meses que viven en entornos donde la anemia es muy prevalente. El esquema sugerido es de
  30 mg de hierro elemental al día, en gotas, jarabe o tabletas, durante tres meses consecutivos al
  año.
afirmaciones_clave:
  - La OMS recomienda la suplementación diaria con hierro en niños de 24 a 59 meses en entornos donde la anemia es muy prevalente.
  - El esquema sugerido es de 30 mg de hierro elemental al día.
  - El esquema dura tres meses consecutivos al año.
