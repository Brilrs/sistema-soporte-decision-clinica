consulta: ¿Cuál es el tratamiento de la anemia moderada y cómo es el seguimiento con control de hemoglobina?
estado_esperado: VERIFICADA
clasificacion_esperada: ANEMIA_MODERADA
requiere_derivacion: false
evidencia_suficiente_esperada: true
criterios:
  - id: C1
    descripcion: Dosis y duración del tratamiento de 6 meses a 11 años
    obligatorio: true
    alternativas:
      - documento: NTS 213-MINSA/DGIESP-2024
        paginas: [19, 19]
        numeral: 6.1.2 B.3
        texto_anclaje: "Se indica suplemento de hierro a una dosis de 3mg/kg/día, durante 6 meses continuos (Tabla N°17)."
      - documento: NTS 213-MINSA/DGIESP-2024
        paginas: [19, 19]
        numeral: 6.1.2 B.3, Tabla N° 17
        texto_anclaje: "| 6 a 35 meses | 3 mg/Kg/día (Máximo dosis 70 mg/día) |"
  - id: C2
    descripcion: Controles de hemoglobina durante el tratamiento de 6 a 35 meses
    obligatorio: true
    alternativas:
      - documento: NTS 213-MINSA/DGIESP-2024
        paginas: [23, 23]
        numeral: 6.1.2 B.11, Tabla N° 20
        texto_anclaje: "| 6 meses a 35 meses | Al mes de iniciado tratamiento. Al segundo, tercer y sexto mes de iniciado tratamiento |"
      - documento: NTS 213-MINSA/DGIESP-2024
        paginas: [22, 23]
        numeral: 6.1.2 B.11
        texto_anclaje: "En el niño y la niña menor de 36 meses, se realiza al mes, al 2o mes, 3o mes y 6o mes de iniciado el tratamiento."
  - id: C3
    descripcion: Incremento esperado de hemoglobina a los 30 días
    obligatorio: false
    alternativas:
      - documento: NTS 213-MINSA/DGIESP-2024
        paginas: [22, 23]
        numeral: 6.1.2 B.11
        texto_anclaje: "A los 30 días de iniciado el tratamiento con suplemento de hierro, el incremento de Hb debe ser mayor o igual de 1g/dL"
  - id: C4
    descripcion: Consulta ambulatoria mensual de seguimiento
    obligatorio: false
    alternativas:
      - documento: NTS 213-MINSA/DGIESP-2024
        paginas: [22, 23]
        numeral: 6.1.2 B.11
        texto_anclaje: "una vez al mes para verificar la adherencia al suplemento de hierro, reforzar la consejería nutricional"
respuesta_referencia: >-
  El tratamiento es con suplemento de hierro a 3 mg/kg/día (máximo 70 mg/día de 6 a 35 meses),
  diario durante 6 meses continuos. La hemoglobina se controla al mes, al segundo, al tercer y al
  sexto mes de iniciado el tratamiento; a los 30 días el incremento debe ser de 1 g/dL o más. La
  consulta de seguimiento es mensual para verificar la adherencia y reforzar la consejería
  nutricional.
afirmaciones_clave:
  - El tratamiento es con suplemento de hierro a 3 mg/kg/día durante 6 meses continuos.
  - La hemoglobina se controla al mes, al segundo, al tercer y al sexto mes de iniciado el tratamiento.
