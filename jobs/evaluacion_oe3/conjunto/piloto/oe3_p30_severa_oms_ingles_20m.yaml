respuesta_referencia: >-
  Según la OMS, de 6 a 23 meses no hay anemia con 105 g/L o más; la anemia es leve de 95 a 104 g/L,
  moderada de 70 a 94 g/L y severa por debajo de 70 g/L. De 24 a 59 meses: sin anemia con 110 g/L o
  más, leve de 100 a 109, moderada de 70 a 99 y severa por debajo de 70 g/L. Como este niño tiene
  anemia severa, se indica el tratamiento como un caso de anemia moderada y se refiere
  inmediatamente a un establecimiento de mayor capacidad resolutiva para la atención especializada.
afirmaciones_clave:
  - Según la OMS, de 6 a 23 meses la anemia es severa por debajo de 70 g/L.
  - Según la OMS, de 6 a 23 meses la anemia es moderada de 70 a 94 g/L y leve de 95 a 104 g/L.
  - En la anemia severa se refiere inmediatamente a un establecimiento de mayor capacidad resolutiva.
