respuesta_referencia: >-
  El niño nacido a término y con buen peso al nacer inicia la suplementación preventiva a los 4
  meses de edad, con 2 mg/kg/día de sulfato ferroso o complejo polimaltosado férrico en gotas, de
  forma diaria, hasta los 6 meses cumplidos.
afirmaciones_clave:
  - La suplementación preventiva del nacido a término con adecuado peso inicia a los 4 meses de edad.
  - La dosis es de 2 mg/kg/día en gotas.
  - Se da de forma diaria hasta los 6 meses cumplidos.
