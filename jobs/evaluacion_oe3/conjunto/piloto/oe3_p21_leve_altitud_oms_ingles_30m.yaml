notas: >-
  Depende de un fragmento en inglés (OMS 2024, Table 4). La pregunta es qué propone la OMS: la Tabla
  N° 1 de la RM 429 (1,4 g/dL) no se acepta como alternativa, como en P09. Con el ajuste de la RM,
  11,6 menos 1,4 da 10,2 g/dL: anemia leve de 24 a 59 meses. La respuesta conserva la unidad de la
  OMS (g/L).
