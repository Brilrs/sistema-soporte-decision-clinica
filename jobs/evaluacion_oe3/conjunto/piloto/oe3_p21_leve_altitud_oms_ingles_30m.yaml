respuesta_referencia: >-
  La OMS propone un ajuste de 14 g/L para una residencia entre 2000 y 2499 msnm. El ajuste se aplica
  restando esa cantidad de la hemoglobina observada de la persona o sumándola al punto de corte que
  define la anemia.
afirmaciones_clave:
  - La OMS propone un ajuste de 14 g/L para 2000 a 2499 msnm.
  - El ajuste se resta de la hemoglobina observada o se suma al punto de corte.
