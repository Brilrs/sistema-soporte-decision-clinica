respuesta_referencia: >-
  Por ser anemia severa, se indica el tratamiento como un caso de anemia moderada y se refiere
  inmediatamente a un establecimiento de mayor capacidad resolutiva para la atención especializada.
  La dosis es de 3 mg/kg/día, con un máximo de 70 mg/día de 6 a 35 meses, con sulfato ferroso o
  complejo polimaltosado férrico en gotas o jarabe, diaria, durante 6 meses continuos.
afirmaciones_clave:
  - Se refiere inmediatamente a un establecimiento de mayor capacidad resolutiva.
  - La dosis es de 3 mg/kg/día con un máximo de 70 mg/día.
