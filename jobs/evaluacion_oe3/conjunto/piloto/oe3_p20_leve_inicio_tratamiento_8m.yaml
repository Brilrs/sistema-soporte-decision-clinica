respuesta_referencia: >-
  No hay que esperar. Cuando la hemoglobina es menor a lo normal se considera anemia sin
  especificación y se inicia el tratamiento hasta la evaluación de los resultados de los exámenes de
  apoyo al diagnóstico; esos análisis de laboratorio se solicitan de inmediato.
afirmaciones_clave:
  - El tratamiento se inicia sin esperar los resultados de los exámenes de apoyo al diagnóstico.
  - Mientras tanto se considera anemia sin especificación.
