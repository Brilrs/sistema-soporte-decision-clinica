      - documento: NTS 213-MINSA/DGIESP-2024
        paginas: [22, 22]
        numeral: 6.1.2 B.7
        texto_anclaje: "Se indica el tratamiento como un caso de anemia moderada y se refiere inmediatamente a un establecimiento de salud de mayor capacidad resolutiva para la atención especializada."
  - id: C2
    descripcion: Palidez de piel y mucosas como signo principal
    obligatorio: true
    alternativas:
      - documento: RM 429-2024/MINSA
        paginas: [8, 9]
        numeral: 6.1.2 A, Tabla N° 12 (modificación N.° 9)
        texto_anclaje: "Piel y membranas mucosas pálidas (signo principal), piel seca, caída del cabello, pelo ralo y uñas quebradizas"
  - id: C3
    descripcion: Síntomas generales
    obligatorio: false
    alternativas:
      - documento: RM 429-2024/MINSA
        paginas: [8, 9]
        numeral: 6.1.2 A, Tabla N° 12 (modificación N.° 9)
        texto_anclaje: "| Síntomas generales | Sueño incrementado, astenia, inapetencia, anorexia, irritabilidad, rendimiento físico disminuido, fatiga"
  - id: C4
    descripcion: Síntomas cardiopulmonares con hemoglobina muy baja
    obligatorio: false
    alternativas:
      - documento: RM 429-2024/MINSA
        paginas: [8, 9]
        numeral: 6.1.2 A, Tabla N° 12 (modificación N.° 9)
        texto_anclaje: "Taquicardia, soplo y disnea del esfuerzo. Estas condiciones se pueden presentar cuando el valor de hemoglobina es muy bajo (<5g/dL)."
respuesta_referencia: >-
  En el examen físico se buscan la piel y membranas mucosas pálidas (signo principal), piel seca,
  caída del cabello, pelo ralo y uñas quebradizas; síntomas generales como sueño incrementado,
  astenia, inapetencia, irritabilidad y fatiga; y taquicardia, soplo y disnea de esfuerzo, que
  pueden presentarse con hemoglobina muy baja (menos de 5 g/dL). Por ser anemia severa, se indica el
  tratamiento como un caso de anemia moderada y se refiere inmediatamente a un establecimiento de
  mayor capacidad resolutiva.
afirmaciones_clave:
  - El signo principal es la palidez de piel y membranas mucosas.
  - Se refiere inmediatamente a un establecimiento de mayor capacidad resolutiva.
