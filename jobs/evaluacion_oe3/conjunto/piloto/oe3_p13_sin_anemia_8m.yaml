respuesta_referencia: >-
  Con hemoglobina de 10,5 g/dL o más, inicia la suplementación de hierro de forma diaria durante 6
  meses continuos. La dosis es de 2 mg/kg, con sulfato ferroso o complejo polimaltosado férrico en
  gotas o jarabe, diaria, durante 6 meses consecutivos. La Tabla N° 6 incluye también 1 sobre diario
  de micronutrientes durante 6 meses consecutivos.
afirmaciones_clave:
  - La dosis preventiva de 6 a 11 meses es de 2 mg/kg de hierro.
  - La suplementación es diaria durante 6 meses.
  - Se inicia si la hemoglobina es de 10,5 g/dL o más.
