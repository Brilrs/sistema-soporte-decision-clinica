respuesta_referencia: >-
  Ante estreñimiento en menores de 36 meses se recomienda darle lactancia materna más seguida y
  fraccionar la dosis en 2 tomas. Si los efectos adversos limitan la continuidad del sulfato
  ferroso, se emplea como alternativa el complejo polimaltosado férrico. Las reacciones adversas se
  reportan en el formato de notificación de sospechas de reacciones adversas a medicamentos.
afirmaciones_clave:
  - Ante estreñimiento se da lactancia materna más seguida y se fracciona la dosis en 2 tomas.
  - Si los efectos adversos limitan la continuidad se emplea como alternativa el complejo polimaltosado férrico.
