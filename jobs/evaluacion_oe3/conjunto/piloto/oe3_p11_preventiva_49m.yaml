evidencia_suficiente_esperada: true
criterios:
  - id: C1
    descripcion: Dosis, producto y duración de 36 a 59 meses (Tabla N° 8 vigente)
    obligatorio: true
    alternativas:
      - documento: RM 429-2024/MINSA
        paginas: [7, 7]
        numeral: 6.1.1 B, Tabla N° 8 (modificación N.° 7)
        texto_anclaje: "| 36 a 59 meses | 30 mg Hierro elemental* | Sulfato Ferroso o Complejo Polimaltosado Férrico* | jarabe | Diaria | 3 meses continuos en el año |"
  - id: C2
    descripcion: Duración de 3 meses de 36 a 59 meses
    obligatorio: true
    alternativas:
      - documento: RM 429-2024/MINSA
        paginas: [7, 7]
        numeral: 6.1.1 B, Tabla N° 8 (modificación N.° 7)
        texto_anclaje: "| 36 a 59 meses | 30 mg Hierro elemental* | Sulfato Ferroso o Complejo Polimaltosado Férrico* | jarabe | Diaria | 3 meses continuos en el año |"
      - documento: NTS 213-MINSA/DGIESP-2024
        paginas: [13, 13]
        numeral: 6.1.1 B.4
        texto_anclaje: "el niño y la niña de 36 a 59 meses, durante 3 meses; en ambos es de forma diaria y continua."
  - id: C3
    descripcion: Condición de hemoglobina para iniciar
    obligatorio: false
    alternativas:
      - documento: NTS 213-MINSA/DGIESP-2024
        paginas: [13, 13]
        numeral: 6.1.1 B.4
        texto_anclaje: "Se inicia la suplementación cuando la Hb es ≥ 11 g/dL"
  - id: C4
    descripcion: Alternativa de micronutrientes de 36 a 59 meses
    obligatorio: false
    alternativas:
      - documento: RM 429-2024/MINSA
        paginas: [7, 7]
        numeral: 6.1.1 B, Tabla N° 8 (modificación N.° 7)
        texto_anclaje: "| 36 a 59 meses | 2 sobres | Micronutrientes en polvo de 1 g | polvo | Diaria | 3 meses continuos en el año |"
respuesta_referencia: >-
  Con hemoglobina de 11 g/dL o más, le corresponde suplementación preventiva con 30 mg de hierro
  elemental al día (sulfato ferroso o complejo polimaltosado férrico en jarabe), o 2 sobres diarios de
  micronutrientes en polvo, durante 3 meses continuos en el año.
afirmaciones_clave:
  - Le corresponden 30 mg de hierro elemental al día en jarabe.
  - La suplementación dura 3 meses continuos en el año.
revisado: false
