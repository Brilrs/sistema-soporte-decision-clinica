fecha_revision: null
observaciones_revision: null
notas: >-
  La Tabla N° 8 original de la NTS (página 13) fue reemplazada por la RM 429 y no está vigente: no
  cuenta para C1. La Table B de la OMS 2016 coincide en dosis y duración, pero no se acepta como
  alternativa de una norma nacional sin decisión de la ficha.
