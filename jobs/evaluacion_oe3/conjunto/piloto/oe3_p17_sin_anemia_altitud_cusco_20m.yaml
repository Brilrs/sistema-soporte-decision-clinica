respuesta_referencia: >-
  Para una residencia entre 3000 y 3499 msnm el ajuste es de 2,1 g/dL, que se resta de la
  hemoglobina observada: 12,9 menos 2,1 da 10,8 g/dL, sin anemia. La suplementación preventiva de 12
  a 23 meses es con 2 mg/kg/día de sulfato ferroso o complejo polimaltosado férrico en gotas o
  jarabe, diaria, durante 6 meses consecutivos.
afirmaciones_clave:
  - El ajuste por altitud para 3000 a 3499 msnm es 2,1 g/dL y se resta de la hemoglobina observada.
  - La hemoglobina ajustada es 10,8 g/dL.
  - La dosis preventiva de 12 a 23 meses es de 2 mg/kg/día durante 6 meses.
