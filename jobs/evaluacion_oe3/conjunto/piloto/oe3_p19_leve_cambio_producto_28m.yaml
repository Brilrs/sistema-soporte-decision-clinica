respuesta_referencia: >-
  Sí. Cuando la adherencia al sulfato ferroso no es adecuada (menos del 75 % de consumo del
  suplemento en el mes) o hay efectos adversos que limitan la continuidad, se emplea como
  alternativa el complejo polimaltosado férrico. La adherencia es adecuada cuando se consume el 75 %
  o más de la dosis indicada durante un periodo mensual.
afirmaciones_clave:
  - Ante una adherencia no adecuada al sulfato ferroso se emplea como alternativa el complejo polimaltosado férrico.
  - La adherencia no es adecuada con menos del 75 % de consumo del suplemento en el mes.
