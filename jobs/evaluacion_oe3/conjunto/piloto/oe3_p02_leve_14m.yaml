  fuente: seed_demo
  dni_ficticio: "81234567"
  fecha_tamizaje: 2026-09-26
fecha_referencia: 2026-10-20
consulta: Tiene anemia leve y no recibe suplementación con hierro. ¿Qué tratamiento le corresponde y en qué dosis?
estado_esperado: VERIFICADA
clasificacion_esperada: ANEMIA_LEVE
requiere_derivacion: false
evidencia_suficiente_esperada: true
criterios:
  - id: C1
    descripcion: Dosis y duración del tratamiento de 6 meses a 11 años
    obligatorio: true
    alternativas:
      - documento: NTS 213-MINSA/DGIESP-2024
        paginas: [19, 19]
        numeral: 6.1.2 B.3
        texto_anclaje: "Se indica suplemento de hierro a una dosis de 3mg/kg/día, durante 6 meses continuos (Tabla N°17)."
  - id: C2
    descripcion: Dosis máxima, producto y presentación de 6 a 35 meses (Tabla N° 17)
    obligatorio: true
    alternativas:
      - documento: NTS 213-MINSA/DGIESP-2024
        paginas: [19, 19]
        numeral: 6.1.2 B.3, Tabla N° 17
        texto_anclaje: "| 6 a 35 meses | 3 mg/Kg/día (Máximo dosis 70 mg/día) | Sulfato Ferroso o Complejo Polimaltosado Férrico* | gotas o jarabe | Diaria | 6 meses continuos |"
  - id: C3
    descripcion: Al concluir el tratamiento se inicia la suplementación preventiva
    obligatorio: false
    alternativas:
      - documento: NTS 213-MINSA/DGIESP-2024
        paginas: [19, 19]
        numeral: 6.1.2 B.3
        texto_anclaje: "Concluido el tratamiento, se inicia la suplementación preventiva de acuerdo a la edad."
respuesta_referencia: >-
  Le corresponde tratamiento con suplemento de hierro a 3 mg/kg/día, con un máximo de 70 mg/día,
  con sulfato ferroso o complejo polimaltosado férrico en gotas o jarabe, de forma diaria durante
  6 meses continuos. Concluido el tratamiento, se inicia la suplementación preventiva de acuerdo a
  la edad.
afirmaciones_clave:
  - El tratamiento es con suplemento de hierro a 3 mg/kg/día.
  - La dosis máxima de 6 a 35 meses es 70 mg/día.
  - El tratamiento es diario durante 6 meses continuos.
revisado: false
revisado_por: null
fecha_revision: null
observaciones_revision: null
notas: >-
  El texto de anclaje de C3 termina en punto a propósito: el apartado B.2 (menores de 6 meses, misma
  página) dice «de acuerdo a la edad, según se establece en la presente norma» y no debe contar.
