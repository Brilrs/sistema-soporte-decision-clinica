respuesta_referencia: >-
  Para una residencia entre 3000 y 3499 msnm el ajuste es de 2,1 g/dL, que se resta de la
  hemoglobina observada: 11,5 menos 2,1 da 9,4 g/dL, anemia moderada de 24 a 59 meses. El
  tratamiento es de 3 mg/kg/día, con un máximo de 90 mg/día de 36 a 59 meses, con sulfato ferroso o
  complejo polimaltosado férrico en jarabe, diario, durante 6 meses continuos.
afirmaciones_clave:
  - El ajuste por altitud para 3000 a 3499 msnm es 2,1 g/dL.
  - La hemoglobina ajustada es 9,4 g/dL.
  - La dosis máxima de 36 a 59 meses es 90 mg/día.
