respuesta_referencia: >-
  Sí. La OMS recomienda la suplementación diaria con hierro como intervención de salud pública en
  lactantes y niños pequeños de 6 a 23 meses que viven en entornos donde la anemia es muy
  prevalente. El esquema sugerido es de 10 a 12,5 mg de hierro elemental, en gotas o jarabe, diario,
  durante tres meses consecutivos al año.
afirmaciones_clave:
  - La OMS recomienda la suplementación diaria con hierro en niños de 6 a 23 meses en entornos donde la anemia es muy prevalente.
  - El esquema sugerido es de 10 a 12,5 mg de hierro elemental al día.
