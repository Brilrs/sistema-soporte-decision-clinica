# Casos de la prueba de punta a punta (parte C). Todos usan pacientes ficticios de
# seed_demo, identificados por su DNI ficticio y la fecha del tamizaje. Las fechas se
# evalúan contra fecha_referencia para que la vigencia de 30 días no dependa del día en
# que se ejecuta la prueba.
#
# falso: modos del cliente falso por intento (app/rag/cliente_llm.py); el último se
# repite. preferir_ingles hace que el cliente falso cite un fragmento en inglés si hay.
fecha_referencia: 2026-10-20
casos:
