# Grupo etario de cada fragmento (parte C2). La recuperación lo usa para subir los
# fragmentos cuyo rango incluye la edad del paciente y bajar los que la excluyen
# (sin filtro duro). Un fragmento sin edad ni población aplica a todos (GENERAL).
#
# origen por documento:
#   SECCION: el rango sale de los títulos de la sección del fragmento (último nivel,
#            títulos contenidos y título de la tabla transcrita).
#   TEXTO:   el rango sale del texto del fragmento; si el texto nombra más de un rango
#            o varias poblaciones, el fragmento queda marcado como dudoso para revisión.
#   GENERAL: todos los fragmentos del documento quedan GENERAL, sin rango y sin marca de
#            dudoso (corrección manual de todo el documento).
documentos:
  rm251: SECCION
  rm429: TEXTO
  # Revisión de Brii (2026-11-12): guía de puntos de corte de hemoglobina sin
  # recomendaciones específicas por edad. Una revisión de muestra mostró etiquetas
  # ADOLESCENTE, GESTANTE y MUJER_EDAD_FERTIL sacadas de texto metodológico
  # (fragmentos 14, 25, 30, 31, 47, 48, 51, 52, 55).
  oms2024: GENERAL
  oms2016: TEXTO

# Correcciones manuales después de la revisión de la página grupos_etarios.html. Cada
# entrada se aplica a los fragmentos del documento cuya sección o texto contiene el
# texto indicado (sin mayúsculas ni tildes) y reemplaza el rango calculado.
#   - documento: oms2016
#     texto_contiene: "daily iron supplementation is recommended as a public health intervention in preschool"
#     edad_min_meses: 24
#     edad_max_meses: 59
#     poblacion: NINO
#     nota: "Recuadro de recomendación de 24 a 59 meses"
manuales: []

