# Consultas de referencia de la recuperación (20). Cada una indica las secciones de
# las guías indexadas que deberían aparecer entre los 5 fragmentos seleccionados.
# Una consulta acierta si algún fragmento del top 5 cumple alguna de las
# alternativas de «esperado»:
#   documento:        código del documento (codigo_documento)
#   seccion_contiene: texto que aparece en la sección del fragmento, o
#   texto_contiene:   texto que aparece en el fragmento, o
#   paginas:          [inicio, fin] que se superponen con las del fragmento.
# Las secciones esperadas son una propuesta hecha a partir de los fragmentos
# indexados (versión 3) y llevan revisar: true hasta que el equipo clínico las
# confirme. Todas las consultas son sintéticas.

