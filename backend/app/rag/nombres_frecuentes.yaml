# Se excluyen a propósito los que también son palabras comunes del español o términos
# clínicos, porque se borrarían de consultas legítimas. Por ejemplo: Rosa, Luz, Flor,
# Paz, Sol, Mar, Clara, Iris, Dolores, Milagros, Pilar, Rocío, Victoria, Esperanza,
# Mercedes, Rosario, Soledad, Consuelo, Amparo, Concepción, Mateo, Jesús, Ángel, Mía,
# Salvador, Severo, Benigno, Máximo, Justo, Domingo, Primo, Franco, Blanca, Celeste,
