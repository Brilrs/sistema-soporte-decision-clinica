# Conjunto de prueba final de la recuperación (Sprint 2 B2). Se escribió el
# 06/11/2026 antes de probar cualquier mejora de la primera etapa y se mide una sola
# vez, al final. No se usa para ajustar reglas, diccionario, umbrales ni parámetros:
# si un resultado lleva a cambiar algo, estas consultas pasan a ser de desarrollo y
# se escribe un conjunto de prueba nuevo.
#
# casos: datos estructurados de un tamizaje (los campos de ContextoClinico). La
#   consulta es la que arma app.rag.consulta_estructurada.construir_consulta, la
#   misma que usará el grafo en la parte D. plan indica el caso de la prueba de punta
#   a punta del plan del Sprint 2. Los casos 7 (falta la hemoglobina), 8 (fuera del
#   dominio) y 9 (nombre y DNI en la consulta) del plan no llegan a la recuperación
#   con una consulta estructurada propia y se reemplazan por los casos P08 a P10.
# libres: preguntas en lenguaje natural, nuevas, sobre temas no cubiertos por las
#   consultas de referencia ni de validación.
#
# Criterio de acierto: el mismo que consultas_referencia.yaml (algún fragmento del
# top 5 cumple alguna sección esperada). Las secciones esperadas se tomaron del texto
# de las guías indexadas (versión 3), no de los resultados de la recuperación: son
# las que responden la pregunta principal del caso y, si el caso tiene una condición
# propia (altitud, parasitosis, nacimiento prematuro o con bajo peso), también las
# que tratan esa condición. Todas llevan revisar: true hasta que el equipo clínico
# las confirme. Todos los datos son sintéticos.
#
# Corrección antes de la medición (06/11/2026): el diagnóstico del conjunto de
# desarrollo mostró que en 29 de los 77 fragmentos de la NTS con sección, la sección
# asignada era la del título anterior. Las secciones esperadas de la NTS se cambiaron
# de seccion_contiene a texto_contiene con el título, antes de medir este conjunto.
# Con el fragmentador corregido y la reindexación en la versión 4 (07/11/2026), la
# sección corresponde al contenido y esas comprobaciones volvieron a seccion_contiene.
#
# Estado (07/11/2026): este conjunto ya se midió y se usó para decidir (P08 recibió una
# sección aceptable después de ver el resultado). Ya no es independiente: se informa
# solo como referencia y los cambios se evalúan con el conjunto de desarrollo.

