# alcance (gestantes, adolescentes, adultos) quedan fuera; los términos propios del
# dominio (anemia, hemoglobina, hierro, suplementación...) dejan la consulta dentro.
# Sin esos términos decide la similitud de embeddings con estas listas: dentro si la
# más parecida es de «dentro» y alcanza UMBRAL_DOMINIO. Todas son sintéticas.

