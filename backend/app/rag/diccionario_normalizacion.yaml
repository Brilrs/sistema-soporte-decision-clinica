# Diccionario de normalización de consultas (2.4), sin UMLS.
#
# abreviaturas: se expanden en la consulta antes de buscar (clave sin tildes y en
#   minúsculas; se reconoce como palabra completa).
# conceptos: término preferido en español, sinónimos (incluidas las expresiones del
#   español peruano usadas en los establecimientos), descriptor MeSH, descriptor DeCS
#   y equivalentes en inglés para consultar las guías OMS. El CUI de UMLS queda vacío
#   porque no se cuenta con licencia.
#
# Todos los identificadores MeSH y DeCS llevan verificar: true. Se tomaron de memoria
# y deben contrastarse con https://meshb.nlm.nih.gov y https://decs.bvsalud.org antes
# de darlos por válidos. Un id vacío indica que no se encontró un descriptor exacto.
#
# dominio: true marca los conceptos propios de la anemia infantil; el filtro de
# dominio acepta la consulta que menciona alguno (por ejemplo «chispitas» o
# «sangrecita»). Los conceptos generales (niño, seguimiento, derivación) no cuentan.

abreviaturas:
  hb: hemoglobina
  hgb: hemoglobina
  sf: sulfato ferroso
  mmn: multimicronutrientes
  cred: control de crecimiento y desarrollo
  rn: recien nacido
  bpn: bajo peso al nacer
  lme: lactancia materna exclusiva
  msnm: metros sobre el nivel del mar
  m.s.n.m: metros sobre el nivel del mar
  pcr: proteina c reactiva
  eess: establecimiento de salud
  ipress: institucion prestadora de servicios de salud
  vo: via oral
  oms: organizacion mundial de la salud
  who: organizacion mundial de la salud
  minsa: ministerio de salud
  nts: norma tecnica de salud

