[pytest]
testpaths = tests
markers =
    lenta: necesita los PDF de data/guias o una base con las guías indexadas; se ejecuta con -m lenta
    api_real: llama a la API real de Anthropic (parte C); nunca se ejecuta en CI
    chroma_real: usa un servidor ChromaDB real (CHROMA_URL_PRUEBAS) con colecciones guias_clinicas_prueba_; solo local, con -m chroma_real
addopts = -m "not lenta and not api_real and not chroma_real"
